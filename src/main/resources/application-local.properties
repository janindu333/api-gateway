# =============================================================================
# LOCAL DEVELOPMENT PROFILE
# =============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# =============================================================================
# DATABASE CONFIGURATION (Local Development)
# =============================================================================
# Using your existing MySQL service
spring.datasource.url=jdbc:mysql://localhost:3306/baber_gateway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# REDIS CONFIGURATION (Local Development)
# =============================================================================
# Using your existing Redis from Docker Desktop
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# Redis persistence configuration
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# =============================================================================
# UPSTREAMS (local processes — override if your services use different ports)
# =============================================================================
SALOON_SERVICE_URL=http://localhost:8083
BOOKING_SERVICE_URL=http://localhost:8084
IDENTITY_SERVICE_URL=http://localhost:8081
NOTIFICATION_SERVICE_URL=http://localhost:8085
PAYMENT_SERVICE_URL=http://localhost:8086

# =============================================================================
# JWT CONFIGURATION
# =============================================================================
jwt.secret=U2dWa1lwMzczNjc5NzkyRjQyRjQ1Mjg0ODJCNGRiNjI1MTY1NTQ2ODU3NmQ1YTcxNDc0Nw==
jwt.issuer-uri=${JWT_ISSUER_URI:}
jwt.jwks-uri=${JWT_JWKS_URI:}

# =============================================================================
# LOGGING CONFIGURATION (Local Development)
# =============================================================================
logging.level.com.baber.apigateway=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# CORS CONFIGURATION (Local Development)
# =============================================================================
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:4200

# =============================================================================
# ACTUATOR CONFIGURATION (Local Development)
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always