# =============================================================================
# STAGING PROFILE
# =============================================================================

# Server
server.port=8080
server.servlet.context-path=/

# =============================================================================
# DATABASE CONFIGURATION (Staging)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-service}:${DB_PORT:3306}/${DB_NAME:baber_gateway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool sizing between k8s/dev and prod
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Safer than dev defaults
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# REDIS CONFIGURATION (Staging)
# =============================================================================
spring.data.redis.host=${REDIS_HOST:redis-service}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=15
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2

# =============================================================================
# SECURITY / JWT (Keycloak / OAuth2 only — no shared-secret HS256 in gateway)
# =============================================================================
jwt.issuer-uri=${JWT_ISSUER_URI:}
jwt.jwks-uri=${JWT_JWKS_URI:}

# =============================================================================
# OBSERVABILITY
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.environment=staging
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.2}

# =============================================================================
# SWAGGER (typically on for staging)
# =============================================================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}

# =============================================================================
# LOGGING / ERROR HANDLING
# =============================================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.cloud.gateway=${LOG_LEVEL_GATEWAY:INFO}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

