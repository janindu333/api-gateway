# Test profile: in-memory DB, no external Redis/Tempo/Keycloak
spring.application.name=api-gateway-test
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:h2:mem:gateway;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379

eureka.client.enabled=false

jwt.jwks-uri=
jwt.issuer-uri=
jwt.accepted-issuers=

management.tracing.enabled=false
management.otlp.tracing.endpoint=http://127.0.0.1:4318/v1/traces
management.health.redis.enabled=false
management.endpoint.health.probes.enabled=true

services.saloon.url=http://127.0.0.1:18083
services.booking.url=http://127.0.0.1:18084
services.identity.url=http://127.0.0.1:18082
services.notification.url=http://127.0.0.1:18080
services.payment.url=http://127.0.0.1:18086

spring.cloud.gateway.routes[0].id=saloon-service
spring.cloud.gateway.routes[0].uri=${services.saloon.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/saloon/**

spring.cloud.gateway.routes[1].id=booking-service
spring.cloud.gateway.routes[1].uri=${services.booking.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/appointment/**

spring.cloud.gateway.routes[2].id=booking-service-v1
spring.cloud.gateway.routes[2].uri=${services.booking.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/appointments/**

spring.cloud.gateway.routes[3].id=identity-service
spring.cloud.gateway.routes[3].uri=${services.identity.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**
