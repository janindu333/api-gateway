# Base values — image.digest is set by CI/CD at deploy time (@sha256:...)
replicaCount: 1

image:
  digest: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: api.saloon.local
  annotations:
    kubernetes.io/ingress.class: nginx

deployment:
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

probes:
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelaySeconds: 120
    periodSeconds: 15
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelaySeconds: 45
    periodSeconds: 10

env:
  SPRING_PROFILES_ACTIVE: k8s
  SALOON_SERVICE_URL: "http://saloon-service:8083"
  BOOKING_SERVICE_URL: "http://booking-service:8084"
  IDENTITY_SERVICE_URL: "http://identity-service:8082"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8086"
  REDIS_HOST: redis-service
  DB_HOST: mysql-service
  DB_USERNAME: root
  SWAGGER_ENABLED: "true"
  SWAGGER_UI_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://api.saloon.local"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318/v1/traces"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: w3c

secretEnv:
  DB_PASSWORD:
    secretName: saloon-secrets
    key: db-root-password
  JWT_SECRET:
    secretName: saloon-secrets
    key: jwt-secret
