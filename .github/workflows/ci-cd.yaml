# GitFlow: feature PRs -> development -> staging -> main
# - CI: PRs and pushes to development, staging, main (GitHub-hosted)
# - CD staging/prod: push to staging/main -> ECR + EKS (OIDC, see .github/EKS_DEPLOY.md)
# - CD optional: push to main -> Docker Hub (legacy / non-AWS consumers)
# - Local K8s: manual via scripts/deploy-k8s.ps1
#
# See: .github/CI_CD_BRANCHING.md

name: CI/CD for API Gateway

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'api-gateway' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'saloon-system' }}

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean verify -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: target/*.jar
          if-no-files-found: error

  build-push-ecr-staging:
    name: Build and push image (ECR, staging)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push to ECR
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build-push-ecr-production:
    name: Build and push image (ECR, production)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push to ECR
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-staging-eks:
    name: Deploy to EKS (staging)
    needs: build-push-ecr-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME || vars.EKS_CLUSTER_NAME_STAGING }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Roll out api-gateway
        env:
          IMAGE: ${{ needs.build-push-ecr-staging.outputs.image }}
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          kubectl apply -f k8s/api-gateway-deployment.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/api-gateway-service.yaml -n "$NAMESPACE"
          kubectl set image "deployment/api-gateway" "api-gateway=${IMAGE}" -n "$NAMESPACE"
          kubectl patch deployment api-gateway -n "$NAMESPACE" --type=json \
            -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'
          kubectl rollout status deployment/api-gateway -n "$NAMESPACE" --timeout=600s

  deploy-production-eks:
    name: Deploy to EKS (production)
    needs: build-push-ecr-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME || vars.EKS_CLUSTER_NAME_PRODUCTION }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Roll out api-gateway
        env:
          IMAGE: ${{ needs.build-push-ecr-production.outputs.image }}
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          kubectl apply -f k8s/api-gateway-deployment.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/api-gateway-service.yaml -n "$NAMESPACE"
          kubectl set image "deployment/api-gateway" "api-gateway=${IMAGE}" -n "$NAMESPACE"
          kubectl patch deployment api-gateway -n "$NAMESPACE" --type=json \
            -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'
          kubectl rollout status deployment/api-gateway -n "$NAMESPACE" --timeout=600s

  publish-production:
    name: Publish Production image (Docker Hub)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t janindu3/api-gateway:${{ github.sha }} .
          docker tag janindu3/api-gateway:${{ github.sha }} janindu3/api-gateway:latest
          docker push janindu3/api-gateway:${{ github.sha }}
          docker push janindu3/api-gateway:latest
