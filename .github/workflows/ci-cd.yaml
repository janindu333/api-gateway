# GitFlow: feature PRs -> development -> staging -> main
# - CI (build + test): PRs and pushes to development, staging, main (GitHub-hosted)
# - CD: push to main only -> publish Docker image to Docker Hub
# - Local K8s deploy: manual via scripts/deploy-k8s.ps1 (not from GitHub Actions)
#
# See: .github/CI_CD_BRANCHING.md

name: CI/CD for API Gateway

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean verify -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: target/*.jar
          if-no-files-found: error

  publish-production:
    name: Publish Production image (Docker Hub)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t janindu3/api-gateway:${{ github.sha }} .
          docker tag janindu3/api-gateway:${{ github.sha }} janindu3/api-gateway:latest
          docker push janindu3/api-gateway:${{ github.sha }}
          docker push janindu3/api-gateway:latest
