# Enterprise CI/CD — api-gateway only
# GitFlow + EKS + Helm + ECR (digest) + Trivy + Cosign + Docker Hub retag
# See: .github/ENTERPRISE_CICD.md and cicd-pipeline-docs.pdf

name: CI/CD for API Gateway - Enterprise

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: enterprise-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'api-gateway' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'saloon-system' }}
  DOCKERHUB_IMAGE: janindu3/api-gateway

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean verify -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: target/*.jar
          if-no-files-found: error

  build-push-ecr:
    name: Build, scan, sign, and push (ECR)
    needs: ci
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/staging' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      ))
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.environment ||
        startsWith(github.ref, 'refs/tags/v') && 'production' ||
        github.ref == 'refs/heads/main' && 'production' ||
        github.ref == 'refs/heads/staging' && 'staging' ||
        'development'
      }}
    outputs:
      image_digest: ${{ steps.image-ref.outputs.digest_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-api-gateway

      - name: Build and push Docker image to ECR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Set immutable image reference (digest)
        id: image-ref
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          DIGEST_URI="${REGISTRY}/${REPO}@${{ steps.build.outputs.digest }}"
          echo "digest_uri=${DIGEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign sign --yes "${{ steps.image-ref.outputs.digest_uri }}"

  deploy:
    name: Deploy to EKS (Helm atomic)
    needs: build-push-ecr
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/staging' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      ))
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.environment ||
        startsWith(github.ref, 'refs/tags/v') && 'production' ||
        github.ref == 'refs/heads/main' && 'production' ||
        github.ref == 'refs/heads/staging' && 'staging' ||
        'development'
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment environment
        id: deploy-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm upgrade (atomic rollback on failure)
        env:
          DEPLOY_ENV: ${{ steps.deploy-env.outputs.name }}
          IMAGE_DIGEST: ${{ needs.build-push-ecr.outputs.image_digest }}
          NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          helm upgrade --install api-gateway ./helm/api-gateway \
            -f "./helm/api-gateway/values-${DEPLOY_ENV}.yaml" \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set image.digest="${IMAGE_DIGEST}" \
            --atomic \
            --timeout 10m

  publish-dockerhub:
    name: Publish to Docker Hub (retag from ECR digest)
    needs: [ci, build-push-ecr]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull ECR image by digest and push to Docker Hub
        env:
          ECR_IMAGE: ${{ needs.build-push-ecr.outputs.image_digest }}
          SHA_TAG: ${{ github.sha }}
        run: |
          docker pull "${ECR_IMAGE}"
          docker tag "${ECR_IMAGE}" "${{ env.DOCKERHUB_IMAGE }}:${SHA_TAG}"
          docker tag "${ECR_IMAGE}" "${{ env.DOCKERHUB_IMAGE }}:latest"
          docker push "${{ env.DOCKERHUB_IMAGE }}:${SHA_TAG}"
          docker push "${{ env.DOCKERHUB_IMAGE }}:latest"
