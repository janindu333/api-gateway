apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: saloon-system
  labels:
    app: api-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://api.localhost,http://localhost:8080,http://localhost:3000,http://localhost:5500,http://localhost:5173,http://localhost:4200,http://127.0.0.1:8080,http://127.0.0.1:8080/,http://127.0.0.1:5500,http://127.0.0.1:5173,http://127.0.0.1:4200"
            - name: CORS_ALLOW_CREDENTIALS
              value: "true"
            - name: SPRING_WEB_CORS_ALLOWED_ORIGINS
              value: "http://api.localhost,http://localhost:8080,http://localhost:3000,http://localhost:5500,http://localhost:5173,http://localhost:4200,http://127.0.0.1:8080,http://127.0.0.1:8080/,http://127.0.0.1:5500,http://127.0.0.1:5173,http://127.0.0.1:4200"
            - name: SPRING_WEB_CORS_ALLOW_CREDENTIALS
              value: "true"
