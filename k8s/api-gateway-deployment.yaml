apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: saloon-system
  labels:
    app: api-gateway
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            # Optional: override any upstream if service names/ports differ per cluster
            - name: SALOON_SERVICE_URL
              value: "http://saloon-service:8083"
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:8084"
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8082"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8080"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8086"
            - name: REDIS_HOST
              value: "redis-service"
            - name: DB_HOST
              value: "mysql-service"
            # Must match mysql-deployment: MYSQL_ROOT_PASSWORD from saloon-secrets/db-root-password
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saloon-secrets
                  key: db-root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saloon-secrets
                  key: jwt-secret
            # Expose Swagger through Ingress (k8s profile defaults these off)
            - name: SWAGGER_ENABLED
              value: "true"
            - name: SWAGGER_UI_ENABLED
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://localhost:8080,http://api.saloon.local"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
