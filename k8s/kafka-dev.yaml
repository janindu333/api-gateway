# Dev-only: single-node Kafka API (Redpanda) for saloon-system workloads expecting kafka-service:9092.
# Apply after namespace: kubectl apply -f kafka-dev.yaml
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: saloon-system
  labels:
    app: kafka-service
spec:
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
  selector:
    app: kafka-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-service
  namespace: saloon-system
  labels:
    app: kafka-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-service
  template:
    metadata:
      labels:
        app: kafka-service
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=768M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://kafka-service.saloon-system.svc.cluster.local:9092
          ports:
            - containerPort: 9092
              name: kafka
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
